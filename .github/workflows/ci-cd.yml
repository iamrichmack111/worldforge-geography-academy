name: WorldForge CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python, JavaScript and Source Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app AND test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
      - name: Run backend regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Python source
        run: python -m compileall -q server.py worldforge.py scripts
      - name: Verify all JavaScript source
        run: |
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Validate screenshot assets
        run: |
          for f in login mountains earth-3d; do
            test -s "media/screenshots/$f.png"
          done
  container:
    name: Build and publish GHCR container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/iamrichmack111/worldforge-geography-academy:latest
            ghcr.io/iamrichmack111/worldforge-geography-academy:sha-${{ github.sha }}
