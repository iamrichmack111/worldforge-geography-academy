<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldForge Explorer</title>
<style>:root{color-scheme:dark}body{margin:0;background:#101a22;color:#eaf2f3;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 24px;background:#1b2935}h1{font-size:21px;margin:0;color:#9fdbb5}label{display:flex;gap:9px;align-items:center}select,button{background:#314651;border:1px solid #66808a;border-radius:7px;color:white;padding:8px 12px}button{cursor:pointer}main{max-width:1150px;margin:28px auto;padding:0 20px}#viewport{border:1px solid #46606b;border-radius:12px;background:#091720;overflow:hidden;position:relative;height:min(75vh,850px);cursor:grab}#viewport:active{cursor:grabbing}canvas{width:100%;height:100%;display:block}#details{display:flex;gap:22px;flex-wrap:wrap;color:#adc4d0;margin-top:15px}footer{font-size:13px;color:#9bb3bb;padding:12px 0}</style></head><body>
<header><h1>🌍 WorldForge Explorer</h1><label>Map layer <select id="layer"><option value="world">Biomes</option><option value="elevation">Elevation</option><option value="moisture">Moisture</option><option value="temperature">Temperature</option><option value="caves">Underground caves</option></select></label><button id="zoomIn">Zoom +</button><button id="zoomOut">Zoom −</button><button id="reset">Reset view</button></header>
<main><div id="viewport"><canvas id="canvas"></canvas></div><div id="details"><span id="status">Loading...</span><span id="coords">Move pointer over map to inspect location</span></div><footer>Scroll to zoom • Drag to pan • Choose different simulation layers. Generate new seed with worldforge.py and refresh this page.</footer></main>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),box=document.getElementById('viewport');let img=new Image(),scale=1,ox=0,oy=0,drag=false,lastX=0,lastY=0,metadata=null;
let layer=document.getElementById('layer');async function load(){img=new Image();img.onload=()=>{fit();document.getElementById('status').textContent=`Layer: ${layer.options[layer.selectedIndex].text} • Seed: ${metadata?.seed??'unknown'} • ${img.width}×${img.height}`};img.onerror=()=>document.getElementById('status').textContent='Could not load output image. Run python3 -m http.server 8080 from this project folder.';img.src=`output/${layer.value}.png?t=${Date.now()}`;if(layer.value==='world')img.src=`output/world.png?t=${Date.now()}`}
function resize(){const r=box.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}function fit(){const r=box.getBoundingClientRect();scale=Math.min(r.width/img.width,r.height/img.height)*.96;ox=(r.width-img.width*scale)/2;oy=(r.height-img.height*scale)/2;draw()}function draw(){const r=box.getBoundingClientRect(),d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.imageSmoothingEnabled=scale<1; if(img.complete&&img.naturalWidth)ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale)}function zoom(f,cx,cy){let nx=(cx-ox)/scale,ny=(cy-oy)/scale;scale=Math.max(.1,Math.min(scale*f,40));ox=cx-nx*scale;oy=cy-ny*scale;draw()}box.addEventListener('wheel',e=>{e.preventDefault();let r=box.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});box.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;box.setPointerCapture(e.pointerId)});box.addEventListener('pointerup',()=>drag=false);box.addEventListener('pointermove',e=>{if(drag){ox+=e.clientX-lastX;oy+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;draw()}let r=box.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/scale),y=Math.floor((e.clientY-r.top-oy)/scale);document.getElementById('coords').textContent=`Coordinates: ${x}, ${y}`});layer.addEventListener('change',load);document.getElementById('reset').onclick=fit;document.getElementById('zoomIn').onclick=()=>zoom(1.3,box.clientWidth/2,box.clientHeight/2);document.getElementById('zoomOut').onclick=()=>zoom(1/1.3,box.clientWidth/2,box.clientHeight/2);new ResizeObserver(resize).observe(box);fetch('output/world.json').then(x=>x.json()).then(x=>{metadata=x;load()}).catch(load);
</script></body></html>
